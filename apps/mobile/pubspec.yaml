name: proyekkas
description: "RR Teams — aplikasi Android DRMS (pengajuan biaya, approval, absensi)."
publish_to: 'none'

# X.Y.Z+N — N (versionCode) is overridden by CI with --build-number (ADR 0010 decision 13).
version: 0.14.1+1

environment:
  sdk: ">=3.13.4 <4.0.0"
  flutter: 3.47.5

# Every version pinned exactly (no ^, no any) — ADR 0010 package table, re-verified on pub.dev 2026-09-24.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  flutter_appauth: 12.1.0
  flutter_secure_storage: 11.2.0
  drift: 2.35.0
  drift_flutter: 0.3.1
  sqlite3: 3.6.0
  dio: 5.11.1
  camera: 0.12.1
  image_picker: 1.2.3
  flutter_image_compress: 2.5.1
  connectivity_plus: 7.3.1
  signature: 6.4.0
  uuid: 4.6.0
  freezed_annotation: 3.1.0
  package_info_plus: 10.2.1
  device_info_plus: 13.2.0
  intl: 0.20.3
  path_provider: 2.1.6
  path: 1.9.1
  crypto: 3.0.7
  # F4b attendance: GPS fix + Position.isMocked (ADR 0010 package table; re-verified on pub.dev 2026-09-25:
  # 14.0.3, published 2026-06-12, MIT, publisher baseflow.com, 160/160 points).
  geolocator: 14.0.3
  # E3-b background sync (ADR 0010 decision 12, package table: 0.10.10, published 2026-09-07, MIT,
  # publisher fluttercommunity.dev; re-verified on pub.dev 2026-09-26).
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.16.1
  drift_dev: 2.35.0
  freezed: 4.0.2
  flutter_lints: 6.0.0
  mocktail: 1.0.5

# Encrypted SQLite: SQLite3MultipleCiphers via the sqlite3 build hook (ADR 0010 decision 4).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true
  # OFL licence texts, shown in the licence page (LicenseRegistry, lib/app/fonts.dart).
  assets:
    - assets/fonts/OFL-SpaceGrotesk.txt
    - assets/fonts/OFL-DMSans.txt
  # Web admin typography (apps/web/src/theme/fonts.ts, ADR 0015), bundled — no runtime download, no
  # google_fonts package. SIL OFL 1.1 (no Reserved Font Name). Source: github.com/google/fonts @
  # 23e54b51ddffbc7713c583748e3bd86f62b1fa4a, ofl/spacegrotesk/SpaceGrotesk[wght].ttf and
  # ofl/dmsans/DMSans[opsz,wght].ttf, cut into static instances with fontTools 4.60.1
  # `varLib.instancer --static` (DM Sans at opsz=14) so FontWeight selects the right face on every engine.
  # Only the weights the theme uses.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
