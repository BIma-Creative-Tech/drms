# THROWAWAY (branch tmp/d1710-service-gen only, never merged): runs the repo generators on the CI runner
# (no node on the host) and uploads their output: OpenAPI, Payload types, import map, a schema drift check of the
# hand-written migration snapshot, plus typecheck / lint / unit-test logs.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.21.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gen:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
        env:
          POSTGRES_PASSWORD: ci-throwaway-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
      - run: npm ci --no-audit --no-fund
      - name: DB + migrations + generators
        env:
          PG_SUPERUSER_URL: postgres://postgres:ci-throwaway-superuser@127.0.0.1:5432/postgres
        run: |
          for v in OWNER APP RO; do p="$(openssl rand -hex 24)"; echo "::add-mask::$p"; export "PK_F1_${v}_PASSWORD=$p"; done
          node apps/web/test-env/ci-bootstrap.mjs
          cd apps/web
          export DATABASE_URL="postgres://pk_test_owner:${PK_F1_OWNER_PASSWORD}@127.0.0.1:5432/pk_test"
          export PAYLOAD_SECRET=gen-throwaway-secret-0123456789abcdef PK_SKIP_ENV_CHECK=true LOG_LEVEL=warn
          (npx payload migrate 2>&1 | tail -60) | tee "$RUNNER_TEMP/migrate.log" || true
          psql_out=$(node -e "const pg=require('pg');(async()=>{const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query('SELECT (SELECT count(*) FROM service_types) st, (SELECT count(*) FROM companies) co, (SELECT count(*) FROM service_reports_rels) rels, (SELECT data_type FROM information_schema.columns WHERE table_name = \'service_reports\' AND column_name = \'service_type\') col, (SELECT count(*) FROM payload_migrations) mig');console.log(JSON.stringify(r.rows));await c.end()})()" 2>&1) || true
          echo "$psql_out" | tee -a "$RUNNER_TEMP/migrate.log"
          (timeout 300 npx payload migrate:create d1710_drift_check --skip-empty < /dev/null 2>&1 | tail -40) | tee "$RUNNER_TEMP/drift.log" || true
          ls src/migrations | grep drift_check || echo "NO DRIFT FILE" | tee -a "$RUNNER_TEMP/drift.log"
          (timeout 300 npx payload generate:types 2>&1 | tail -20) | tee "$RUNNER_TEMP/types.log" || true
          (timeout 300 npx payload generate:importmap 2>&1 | tail -20) | tee "$RUNNER_TEMP/importmap.log" || true
      - name: gen openapi
        run: npm run gen:openapi -w apps/web 2>&1 | tee "$RUNNER_TEMP/openapi.log" || true
      - name: typecheck
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log" || true
      - name: lint
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/lint.log" || true
      - name: unit tests
        run: |
          cd apps/web
          npx vitest run 2>&1 | tail -150 | tee "$RUNNER_TEMP/unit.log" || true
      - name: collect
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/out/" 2>/dev/null || true
          git status --short > "$RUNNER_TEMP/out/status.txt"
          git diff > "$RUNNER_TEMP/out/all.diff"
          cp apps/web/src/migrations/*drift_check* "$RUNNER_TEMP/out/" 2>/dev/null || true
          cat "$RUNNER_TEMP/out/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen
          path: ${{ runner.temp }}/out
          retention-days: 2
