# ProyekKas Android app CI (ADR 0010 decision 13). Flutter comes from the official tarball, pinned and
# sha256-verified (releases_linux.json, 3.47.5 / Dart 3.13.4). Actions are pinned by commit SHA (resolved
# with `git ls-remote`). Syntax is checked with actionlint 1.7.12.
#
# Artifacts:
#   proyekkas-staging-debug-apk        always: debug build, staging flavor, OIDC redirect = custom scheme
#                                      id.co.drms.proyekkas:/oauth2redirect (debug keys differ per run,
#                                      so the HTTPS App Link could never verify)
#   proyekkas-staging-release-apk      only when the ANDROID_STAGING_* secrets exist: release build signed
#                                      with the stable staging key, redirect = App Link
#                                      https://drms-kas.staging.bimacreative.tech/app/callback
#                                      (that key's SHA-256 must be in the server's ANDROID_APP_CERT_SHA256)
# Every APK is statically scanned for secrets before upload (tool/apk_secret_scan.sh: unpack incl. string
# dumps of dex / Dart AOT, forbidden files, deny-list, gitleaks + trivy with the ci.yml image pins).
#   proyekkas-prod-release-apk         job release-prod (E3-c): ONLY on a tag mobile-vX.Y.Z (pushing the tag
#                                      is the deliberate release step; the private repo on the GitHub Free
#                                      plan has no required reviewers, decision 2026-09-27) in the GitHub
#                                      environment `android-release-prod`; signed with the production key from that
#                                      environment's secrets ANDROID_KEYSTORE_* (two custodians, ADR 0010
#                                      decision 13). The certificate SHA-256 is printed to the log and the
#                                      job summary (Firebase / App Links). apps/mobile/README.md
#                                      "Production signing key" lists the custodian steps.
#                                      After the APKs are verified it creates/updates the GitHub Release of
#                                      the tag: body = docs/release-notes/apk/<version>.md (user-facing,
#                                      Indonesian; the job fails BEFORE building when the file is missing) +
#                                      certificate SHA-256 + CHANGELOG link, assets = the three ABI APKs +
#                                      SHA256SUMS.txt (never the obfuscation symbols). Only this job gets
#                                      `contents: write`; the workflow default stays read.
name: mobile

on:
  push:
    # feat/mobile-** and fix/mobile-** run via pull_request only (avoids duplicate push + PR runs).
    branches: [main, develop]
    # Release tags (path filters are not evaluated for tag pushes).
    tags: ["mobile-v*"]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
  JAVA_VERSION: "17"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  verify:
    name: analyze · format · codegen drift · tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 45 # self-hosted = 2 vCPU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (official tarball, sha256-verified; self-hosted keeps it in the local cache)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: tool/ci_install_flutter.sh
      # GitHub cache only on GitHub-hosted; the self-hosted runner has PUB_CACHE in its persistent cache (plan 12 §4).
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: runner.environment == 'github-hosted'
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock') }}
      - run: flutter config --no-analytics && flutter --version
      - run: flutter pub get --enforce-lockfile
      - name: Generated code is up to date (drift, freezed, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- .
      - name: dart format (hand-written files)
        run: |
          git ls-files 'lib/*.dart' 'test/*.dart' | grep -v -e '\.g\.dart$' -e '\.freezed\.dart$' -e '^lib/l10n/gen/' \
            | xargs dart format --set-exit-if-changed --output=none
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - name: Coverage summary (job summary; the lcov artifact is uploaded on GitHub-hosted only)
        run: |
          awk -F: '/^LF:/ { lf += $2 } /^LH:/ { lh += $2 }
            END { printf "Mobile line coverage: %d / %d lines (%.1f%%)\n", lh, lf, (lf ? 100 * lh / lf : 0) }' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # kuota storage artifact (Free 500 MB) penuh tidak boleh menggagalkan build/rilis; APK prod tetap di GitHub Release
        if: runner.environment == 'github-hosted'
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          retention-days: 3 # Free plan: 500 MB Actions storage

  apk:
    name: build APKs (staging)
    needs: verify
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 75 # self-hosted = 2 vCPU / 4 GiB (debug + 3-ABI release build)
    env:
      HAS_STAGING_KEY: ${{ secrets.ANDROID_STAGING_KEYSTORE_B64 != '' }}
    steps:
      # GitHub's ubuntu-24.04 image has ~14 GB free; Flutter + Gradle + NDK + the debug and three-ABI release builds
      # filled it ("No space left on device" in :app:mergeStagingDebugNativeLibs, mobile-v0.5.0 2026-10-13). Drop
      # toolchains these jobs never use (.NET, Haskell, CodeQL, Boost, Swift, PowerShell, browsers); Android SDK,
      # Java and Docker stay. Self-hosted runners keep their own disk.
      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/google/chrome /opt/microsoft
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (official tarball, sha256-verified; self-hosted keeps it in the local cache)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: tool/ci_install_flutter.sh
      # GitHub cache only on GitHub-hosted; self-hosted: PUB_CACHE + GRADLE_USER_HOME are persistent dirs in the runner image.
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: apk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/**/*.kts') }}
          restore-keys: |
            apk-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - run: flutter config --no-analytics && flutter pub get --enforce-lockfile
      - name: Self-hosted limits (2 vCPU / 4 GiB, plan 12 §6) → Gradle/Kotlin settings
        if: runner.environment == 'self-hosted'
        run: |
          # System properties beat android/gradle.properties (org.gradle.jvmargs=-Xmx8G is sized for 16 GB hosted runners).
          # No Gradle daemon kept around, 1 worker, Kotlin compiled inside the Gradle JVM (no second Kotlin daemon).
          # Heap 1.5 GiB: Gradle -Xmx2g + dart frontend_server (~0.9 GiB) + gen_kernel hit the 4 GiB cgroup OOM killer
          # (infra plan 12 R10 F1, mobile run 36409822850); the passing run peaked at 3.53 GiB.
          echo 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m" -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process' >> "$GITHUB_ENV"
          # Release (R8 + obfuscation) needs more heap: at -Xmx1536m/-Xmx2g assembleStagingRelease died after ~8 min with
          # exit 1 and no kernel OOM (plan 12 R10, 47ac6cd / 197226b). 2.5 GiB + dart (~1 GiB) fits the 5 GiB runner.
          echo 'GRADLE_OPTS_RELEASE=-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process' >> "$GITHUB_ENV"
          echo "::notice::self-hosted: PUB_CACHE=${PUB_CACHE:-unset} GRADLE_USER_HOME=${GRADLE_USER_HOME:-unset} ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Debug APK (staging flavor, custom-scheme redirect)
        run: |
          tool/build_with_retry.sh flutter build apk --debug --flavor staging \
            --dart-define-from-file=config/staging.json \
            --dart-define=PK_OIDC_REDIRECT_URI=id.co.drms.proyekkas:/oauth2redirect \
            --build-number="${GITHUB_RUN_NUMBER}"
          ls -l build/app/outputs/flutter-apk/
      - name: Static secret scan of the debug APK (F4 gate "no secrets in APK")
        run: SCAN_DIR="$RUNNER_TEMP/apk-scan-debug" tool/apk_secret_scan.sh build/app/outputs/flutter-apk/app-staging-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # kuota storage artifact (Free 500 MB) penuh tidak boleh menggagalkan build/rilis; APK prod tetap di GitHub Release
        with:
          name: proyekkas-staging-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7 # Free plan: 500 MB Actions storage
          if-no-files-found: error

      - name: No staging signing key → skip the signed release build
        if: env.HAS_STAGING_KEY != 'true'
        run: echo "::notice::ANDROID_STAGING_* secrets not set; only the debug APK (custom-scheme redirect) was built."
      - name: Decode staging keystore
        if: env.HAS_STAGING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_STAGING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/staging.jks"
          echo "Signing certificate SHA-256 (must be in ANDROID_APP_CERT_SHA256 on staging):"
          keytool -list -v -keystore "$RUNNER_TEMP/staging.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E '^\s*SHA256:'
      - name: Release APK (staging flavor, stable key, App Link redirect)
        if: env.HAS_STAGING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/staging.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
        run: |
          if [ -n "${GRADLE_OPTS_RELEASE:-}" ]; then export GRADLE_OPTS="$GRADLE_OPTS_RELEASE"; fi
          export BUILD_LOG_KEEP="$RUNNER_TEMP/build-release-staging.log"
          tool/build_with_retry.sh flutter build apk --release --flavor staging \
            --dart-define-from-file=config/staging.json \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --obfuscate --split-debug-info=build/symbols --split-per-abi
          ls -l build/app/outputs/flutter-apk/
      - name: Upload the release build log (failure diagnostics, 3 days)
        if: failure() && env.HAS_STAGING_KEY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # kuota storage artifact (Free 500 MB) penuh tidak boleh menggagalkan build/rilis; APK prod tetap di GitHub Release
        with:
          name: build-release-staging-log
          path: ${{ runner.temp }}/build-release-staging.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Static secret scan of the release APKs (gitleaks + trivy + deny-list, tool/apk_secret_scan.sh)
        if: env.HAS_STAGING_KEY == 'true'
        run: SCAN_DIR="$RUNNER_TEMP/apk-scan-release" tool/apk_secret_scan.sh build/app/outputs/flutter-apk/app-*-staging-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # kuota storage artifact (Free 500 MB) penuh tidak boleh menggagalkan build/rilis; APK prod tetap di GitHub Release
        if: env.HAS_STAGING_KEY == 'true'
        with:
          name: proyekkas-staging-release-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-*-staging-release.apk
            apps/mobile/build/symbols/
          retention-days: 3 # Free plan: 500 MB Actions storage (plan 12 §7)
          if-no-files-found: error
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/staging.jks"

  release-prod:
    name: release APKs (prod, production key)
    needs: verify
    # Tag pushes only: a merge to main never builds a production APK (release gate, decision 2026-09-27).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 75 # self-hosted = 2 vCPU / 4 GiB (debug + 3-ABI release build)
    # The production keystore secrets exist ONLY as secrets of this environment (deployment tags
    # restricted to mobile-v*). Required reviewers need a paid plan for private repos; add them there
    # if the organisation upgrades.
    environment: android-release-prod
    # contents: write only for `gh release create/upload` at the end of this job.
    permissions:
      contents: write
    env:
      HAS_PROD_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      # GitHub's ubuntu-24.04 image has ~14 GB free; Flutter + Gradle + NDK + the debug and three-ABI release builds
      # filled it ("No space left on device" in :app:mergeStagingDebugNativeLibs, mobile-v0.5.0 2026-10-13). Drop
      # toolchains these jobs never use (.NET, Haskell, CodeQL, Boost, Swift, PowerShell, browsers); Android SDK,
      # Java and Docker stay. Self-hosted runners keep their own disk.
      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/google/chrome /opt/microsoft
          df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Production key present in the environment
        if: env.HAS_PROD_KEY != 'true'
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_B64 is not set on environment android-release-prod (see apps/mobile/README.md 'Production signing key')."
          exit 1
      - name: Runner tools (gh, python3, xz, jq — the self-hosted image must provide them)
        run: |
          missing=""
          for t in gh python3 xz jq curl; do command -v "$t" > /dev/null || missing+=" $t"; done
          [[ -z "$missing" ]] || { echo "::error::runner lacks:$missing (infra plan 12 R3/R6)"; exit 1; }
      - name: Tag matches pubspec version
        run: |
          want="${GITHUB_REF_NAME#mobile-v}"
          have="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)"
          echo "tag=${want} pubspec=${have}"
          test "${want}" = "${have}" || { echo "::error::tag ${GITHUB_REF_NAME} != pubspec version ${have}"; exit 1; }
      - name: Release notes exist (docs/release-notes/apk/<version>.md)
        run: |
          f="../../docs/release-notes/apk/${GITHUB_REF_NAME#mobile-v}.md"
          test -f "$f" || { echo "::error::$f is missing — write the user-facing release notes before tagging (docs/release-notes/README.md)"; exit 1; }
          grep -qE '^ {0,3}[-*][[:space:]]+[^[:space:]]' "$f" || { echo "::error::$f has no '- ' bullet"; exit 1; }
          echo "Release notes: $f"; cat "$f"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (official tarball, sha256-verified; self-hosted keeps it in the local cache)
        env:
          RUNNER_ENV: ${{ runner.environment }}
        run: tool/ci_install_flutter.sh
      # No shared cache here (GitHub cache or the self-hosted runner's persistent dirs): a release is built from a clean
      # dependency download into $RUNNER_TEMP (lockfile enforced; plan 12 §4 T3 cache poisoning).
      - name: Job-local PUB_CACHE and GRADLE_USER_HOME (no shared cache for a release)
        run: |
          mkdir -p "$RUNNER_TEMP/pub-cache" "$RUNNER_TEMP/gradle-home"
          { echo "PUB_CACHE=$RUNNER_TEMP/pub-cache"; echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home"; } >> "$GITHUB_ENV"
      - run: flutter config --no-analytics && flutter pub get --enforce-lockfile
      - name: Self-hosted limits (2 vCPU / 4 GiB, plan 12 §6) → Gradle/Kotlin settings
        if: runner.environment == 'self-hosted'
        run: |
          # System properties beat android/gradle.properties (org.gradle.jvmargs=-Xmx8G is sized for 16 GB hosted runners).
          # No Gradle daemon kept around, 1 worker, Kotlin compiled inside the Gradle JVM (no second Kotlin daemon).
          # Heap 1.5 GiB: Gradle -Xmx2g + dart frontend_server (~0.9 GiB) + gen_kernel hit the 4 GiB cgroup OOM killer
          # (infra plan 12 R10 F1, mobile run 36409822850); the passing run peaked at 3.53 GiB.
          echo 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m" -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process' >> "$GITHUB_ENV"
          # Release (R8 + obfuscation) needs more heap: at -Xmx1536m/-Xmx2g assembleStagingRelease died after ~8 min with
          # exit 1 and no kernel OOM (plan 12 R10, 47ac6cd / 197226b). 2.5 GiB + dart (~1 GiB) fits the 5 GiB runner.
          echo 'GRADLE_OPTS_RELEASE=-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process' >> "$GITHUB_ENV"
          echo "::notice::self-hosted: PUB_CACHE=${PUB_CACHE:-unset} GRADLE_USER_HOME=${GRADLE_USER_HOME:-unset} ANDROID_HOME=${ANDROID_HOME:-unset}"
      - name: Decode production keystore, print certificate SHA-256
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/prod.jks"
          sha="$(keytool -list -v -keystore "$RUNNER_TEMP/prod.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p')"
          test -n "$sha" || { echo "::error::could not read the certificate SHA-256 (alias/password?)"; exit 1; }
          echo "Production signing certificate SHA-256: $sha"
          echo "PROD_CERT_SHA256=$sha" >> "$GITHUB_ENV"
          {
            echo "### Production signing certificate"
            echo "SHA-256: \`$sha\`"
            echo "Use it for Firebase (Android app SHA-256) and the prod server env ANDROID_APP_CERT_SHA256."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release APKs (prod flavor, production key)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/prod.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${GRADLE_OPTS_RELEASE:-}" ]; then export GRADLE_OPTS="$GRADLE_OPTS_RELEASE"; fi
          export BUILD_LOG_KEEP="$RUNNER_TEMP/build-release-prod.log"
          tool/build_with_retry.sh flutter build apk --release --flavor prod \
            --dart-define-from-file=config/prod.json \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --obfuscate --split-debug-info=build/symbols --split-per-abi
          ls -l build/app/outputs/flutter-apk/
      - name: Verify every APK is signed with the production certificate (apksigner)
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -x "$apksigner" || { echo "::error::apksigner not found under \$ANDROID_HOME/build-tools"; exit 1; }
          want="$(printf '%s' "$PROD_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          for apk in build/app/outputs/flutter-apk/app-*-prod-release.apk; do
            out="$("$apksigner" verify --print-certs "$apk")"
            echo "$apk"; echo "$out" | grep -E 'SHA-256'
            echo "$out" | grep -q "certificate SHA-256 digest: ${want}" \
              || { echo "::error::$apk is not signed with the production certificate"; exit 1; }
          done
      - name: Static secret scan of the release APKs (gitleaks + trivy + deny-list, tool/apk_secret_scan.sh)
        run: SCAN_DIR="$RUNNER_TEMP/apk-scan-prod" tool/apk_secret_scan.sh build/app/outputs/flutter-apk/app-*-prod-release.apk
      - name: Simpan simbol obfuscation di cache runner self-hosted (cadangan bila kuota artifact penuh)
        if: runner.environment == 'self-hosted'
        working-directory: apps/mobile
        run: |
          dest="/cache/release-symbols/${GITHUB_REF_NAME}"
          mkdir -p "$dest" && cp -a build/symbols/. "$dest/" && echo "::notice::simbol tersimpan di runner: ${dest} (host /srv/ci/cache/release-symbols)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # kuota storage artifact (Free 500 MB) penuh tidak boleh menggagalkan build/rilis; APK prod tetap di GitHub Release
        with:
          name: proyekkas-prod-release-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-*-prod-release.apk
            apps/mobile/build/symbols/
          retention-days: 90
          if-no-files-found: error
      - name: GitHub Release (release notes + APKs)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#mobile-v}"
          out="$RUNNER_TEMP/github-release"; mkdir -p "$out"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-prod-release.apk" "$out/ProyekKas-${v}-${abi}.apk"
          done
          (cd "$out" && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            cat "../../docs/release-notes/apk/${v}.md"
            echo
            echo "---"
            echo "HP Android biasa: pakai **ProyekKas-${v}-arm64-v8a.apk** (sama dengan https://drms-kas.bimacreative.tech/unduh setelah diterbitkan)."
            echo
            echo "Sertifikat penandatangan (SHA-256): \`${PROD_CERT_SHA256}\`"
            echo
            echo "Perubahan teknis: [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          } > "$RUNNER_TEMP/release-body.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "ProyekKas APK ${v}" --notes-file "$RUNNER_TEMP/release-body.md"
            gh release upload "$GITHUB_REF_NAME" "$out"/* --clobber
          else
            # --latest=false: the "Latest" badge stays on the web release (v*); APK users get /unduh.
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "ProyekKas APK ${v}" \
              --notes-file "$RUNNER_TEMP/release-body.md" "$out"/*
          fi
          echo "GitHub Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.jks"
